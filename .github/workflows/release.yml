name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-helper:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build corebluetoothd.app (ad-hoc signed)
        run: make helper

      - name: Zip app bundle
        run: |
          cd helper/.build
          ditto -c -k --sequesterRsrc --keepParent \
            corebluetoothd.app \
            corebluetoothd-${{ github.ref_name }}-macos-arm64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: helper/.build/corebluetoothd-${{ github.ref_name }}-macos-arm64.zip
          generate_release_notes: true
          body: |
            Unsigned build (ad-hoc code signature only, no Apple Developer ID/notarisation yet).

            macOS will quarantine this after download and refuse to open it via double-click.
            Either right-click → Open, once, or run:

                xattr -dr com.apple.quarantine corebluetoothd.app
